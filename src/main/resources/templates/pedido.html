<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resumo do Pedido</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            text-align: center;
        }

        .order-summary {
            width: 80%;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 5px;
        }

        .order-items table {
            width: 100%;
            border-collapse: collapse;
        }

        .order-items th, .order-items td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .total {
            font-weight: bold;
        }

        .address, .payment-method {
            margin-top: 20px;
        }

        .button-container {
            margin-top: 30px;
            text-align: center;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin: 0 10px;
        }

        .btn-confirm {
            background-color: #4CAF50;
        }

        .btn-back {
            background-color: #007bff;
        }

        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Resumo do Pedido</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        /* Estilo básico já fornecido */
    </style>
</head>
<body>

<h1>Resumo do Pedido</h1>

<div class="order-summary">

    <div class="order-items">
        <table>
            <thead>
            <tr>
                <th>Produto</th>
                <th>Valor Unitário</th>
                <th>Quantidade</th>
                <th>Valor Total</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${pedido?.produtos}">
                <td th:text="${item?.produto?.nome}"></td>
                <td th:text="${item?.produto?.preco}"></td>
                <td th:text="${item?.quantidade}"></td>
                <td th:text="${item?.total}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="totals">
        <p><strong>Frete:</strong> <span th:text="${pedido?.valorFrete}">0.00</span></p>
        <p class="total"><strong>Total Geral:</strong> <span th:text="${pedido?.valorTotal}">0.00</span></p>
    </div>

    <div class="address">
        <h3>Endereço de Entrega</h3>
        <p th:text="${pedido?.enderecoEntrega}">Rua Exemplo, 123, Cidade</p>
    </div>

    <div class="payment-method">
        <h3>Forma de Pagamento</h3>
        <p th:text="${pedido?.formaPagamento}">Cartão de Crédito</p>
    </div>

    <div class="button-container">
        <!-- Botão de voltar para a página de pagamento -->
        <button class="btn btn-back" onclick="window.location.href='/carrinho/pagamento'">Voltar</button>

        <!-- Botão para concluir a compra -->
        <form action="/pedido/concluir" method="post">
            <button type="submit" class="btn btn-confirm">Concluir Compra</button>
        </form>
    </div>
</div>

</body>
</html>


<script>
    function finalizarCompra() {
        window.location.href = '/pedido/concluir';
    }
</script>

</body>
</html>
