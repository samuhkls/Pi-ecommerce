<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Carrinho de Compras</title>
  <style>
    body {
        font-family: Arial, sans-serif;
    }
    .container {
        width: 90%;
        margin: 0 auto;
        padding-top: 20px;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }
    table, th, td {
        border: 1px solid #ddd;
    }
    th, td {
        padding: 10px;
        text-align: left;
    }
    .total {
        text-align: right;
        font-size: 20px;
        font-weight: bold;
    }
    .btn {
        padding: 10px 15px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }
    .btn:hover {
        background-color: #0056b3;
    }
    input[type="number"] {
        width: 50px;
        text-align: center;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>Carrinho de Compras</h2>
  <table>
    <thead>
    <tr>
      <th>Produto</th>
      <th>Quantidade</th>
      <th>Preço</th>
      <th>Subtotal</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${carrinho}">
      <td th:text="${produtos[entry.key].nome}">Nome do Produto</td> <!-- Produto pelo ID -->
      <td>
        <button onclick="alterarQuantidade(-1, 'quantidade-${entry.key}')">-</button>
        <input type="number" id="quantidade-${entry.key}" th:value="${entry.value}" min="1" readonly />
        <button onclick="alterarQuantidade(1, 'quantidade-${entry.key}')">+</button>
      </td>
      <td th:text="${#numbers.formatCurrency(produtos[entry.key].preco)}">Preço</td> <!-- Preço pelo ID -->
      <td th:text="${#numbers.formatCurrency(entry.value * produtos[entry.key].preco)}">Subtotal</td> <!-- Subtotal -->
    </tr>

    <tr th:if="${#lists.isEmpty(carrinho)}">
      <td colspan="4">Seu carrinho está vazio!</td>
    </tr>
    </tbody>
  </table>

  <input type="text" placeholder="Insira seu CEP"> Insira seu CEP:

  <h3>Escolha o frete:</h3>
  <div>
    <label>
      <input type="radio" name="frete" value="0" onchange="atualizarSubtotal()"> Retirada (Grátis)
    </label><br>
    <label>
      <input type="radio" name="frete" value="10" onchange="atualizarSubtotal()"> Frete Econômico (R$ 10,00)
    </label><br>
    <label>
      <input type="radio" name="frete" value="20" onchange="atualizarSubtotal()"> Frete Rápido (R$ 20,00)
    </label>
  </div>

  <div class="total">
    Total: R$ <span id="subtotal" th:text="${#numbers.formatCurrency(total)}"></span>
  </div>

  <a href="/admin/produtos/home" class="btn">Continuar Comprando</a>
  <a href="/carrinho/pagamento" class="btn">Ir para Pagamento</a>
  <a href="/cadastrar" class="btn">
    <button type="button">Cadastrar</button>
  </a>
</div>

<script>
  function alterarQuantidade(valor, inputId) {
      const quantidadeInput = document.getElementById(inputId);
      let quantidade = parseInt(quantidadeInput.value);

      if (quantidade + valor >= 1) {
          quantidade += valor;
          quantidadeInput.value = quantidade;
          atualizarSubtotal();
      }
  }

  function atualizarSubtotal() {
      let subtotal = 0;
      const items = document.querySelectorAll('[id^="quantidade-"]');

      items.forEach(item => {
          const quantidade = parseInt(item.value);
          const precoElement = item.closest('tr').querySelector('td:nth-child(3)').textContent;
          const preco = parseFloat(precoElement.replace('R$', '').replace(',', '.'));
          subtotal += quantidade * preco;
      });

      const freteSelecionado = document.querySelector('input[name="frete"]:checked');
      const frete = freteSelecionado ? parseFloat(freteSelecionado.value) : 0;

      subtotal += frete;

      document.getElementById('subtotal').textContent = subtotal.toFixed(2);
  }
  function removerProduto(produtoId) {
    // Cria o payload com o ID do produto
    const payload = {
        produtoId: produtoId
    };

    // Envia uma requisição POST para o backend
    fetch('/carrinho/remover', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
    })
    .then(response => {
        if (response.ok) {
            alert('Produto removido com sucesso!');
            location.reload(); // Recarrega a página para atualizar o carrinho
        } else {
            alert('Erro ao remover o produto!');
        }
    })
    .catch(error => {
        console.error('Erro:', error);
    });
}
</script>

</body>
</html>
