<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Resumo do Pedido</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h2, h3 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: #28a745;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #218838;
        }
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 50%;
            text-align: center;
        }
        .modal h3 {
            color: #28a745;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover,
        .close:focus {
            color: black;
        }
    </style>
</head>
<body>
<h2>Resumo do Pedido</h2>

<p th:if="${mensagem}" th:text="${mensagem}" style="color: red; font-weight: bold;"></p>

<h3>Detalhes do Pedido</h3>
<table>
    <thead>
    <tr>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Preço Unitário (R$)</th>
        <th>Subtotal (R$)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="produto : ${produtos}">
        <td th:text="${produto.produto.nome}"></td>
        <td th:text="${produto.quantidade}"></td>
        <td th:text="${produto.subtotal}"></td>
    </tr>
    </tbody>
</table>

<p><strong>Valor Total:</strong> R$ <span th:text="${pedido.valorTotal}"></span></p>
<p><strong>Frete:</strong> R$ <span th:text="${pedido.valorFrete}"></span></p>

<form action="/pedido/confirmar-compra" method="post">
    <button type="submit" class="btn btn-success" id="confirmarCompraBtn">Confirmar Compra</button>
</form>


<div id="pedidoModal" class="modal" th:if="${mensagemSucesso}">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h3>Pedido Confirmado com Sucesso!</h3>
        <p><strong>Número do Pedido:</strong> <span th:text="${pedido.numeroPedido}"></span></p>
        <p><strong>Valor Total:</strong> R$ <span th:text="${pedido.valorTotal}"></span></p>
        <p><strong>Status:</strong> <span th:text="${pedido.status}"></span></p>
    </div>
</div>
<script>
    const modal = document.getElementById("pedidoModal");
    if (modal) {
        modal.style.display = "block";
        const span = document.getElementsByClassName("close")[0];
        span.onclick = function () {
            modal.style.display = "none";
        }
        window.onclick = function (event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    }
</script>

</body>
</html>
