<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pagamento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin: 30px auto;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        h2, h3 {
            text-align: center;
            color: #343a40;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #495057;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            display: block;
            text-align: center;
            width: 100%;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .total {
            text-align: right;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            color: #495057;
        }
        .payment-details {
            margin-top: 15px;
            display: none;
        }
        .info-text {
            color: #6c757d;
            font-size: 14px;
        }
        .divider {
            border-bottom: 1px solid #dee2e6;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Pagamento</h2>
    <p><strong>Endereço de Entrega:</strong></p>
    <form>
        <label for="enderecoEntrega">Escolha um Endereço:</label>
        <select name="enderecoEntrega" id="enderecoEntrega" required>
            <option value="" disabled selected>Selecione o endereço</option>
            <th:block th:each="endereco : ${cliente.enderecosEntrega}">
                <option th:value="${endereco.id}" th:text="${endereco.logradouro + ', ' + endereco.numero + ', ' + endereco.bairro + ' - ' + endereco.localidade + '/' + endereco.uf}"></option>
            </th:block>
        </select>
    </form>


    <div class="divider"></div>

    <h3>Escolha a Forma de Pagamento</h3>
    <form action="/gerar-pedido" method="post">
        <label for="formaPagamento">Forma de Pagamento:</label>
        <select name="formaPagamento" id="formaPagamento" required onchange="mostrarDetalhesPagamento()">
            <option value="" disabled selected>Selecione</option>
            <option value="credito">Cartão de Crédito</option>
            <option value="debito">Cartão de Débito</option>
            <option value="boleto">Boleto Bancário</option>
        </select>

        <!-- Detalhes Dinâmicos de Pagamento -->
        <div class="payment-details" id="detalhesCredito">
            <!-- Dados do Cartão de Crédito -->
            <h4>Cartão de Crédito</h4>
            <label for="numeroCartao">Número do Cartão:</label>
            <input type="text" id="numeroCartao" name="numeroCartao" placeholder="1234 5678 9012 3456">
            <label for="nomeTitular">Nome do Titular:</label>
            <input type="text" id="nomeTitular" name="nomeTitular" placeholder="Nome impresso no cartão">
            <label for="validadeCartao">Validade:</label>
            <input type="text" id="validadeCartao" name="validadeCartao" placeholder="MM/AA">
            <label for="codigoSeguranca">Código de Segurança:</label>
            <input type="text" id="codigoSeguranca" name="codigoSeguranca" placeholder="CVV">
        </div>

        <div class="payment-details" id="detalhesDebito">
            <!-- Dados do Cartão de Débito -->
            <h4>Cartão de Débito</h4>
            <label for="numeroCartaoDebito">Número do Cartão:</label>
            <input type="text" id="numeroCartaoDebito" name="numeroCartaoDebito" placeholder="1234 5678 9012 3456">
            <label for="nomeTitularDebito">Nome do Titular:</label>
            <input type="text" id="nomeTitularDebito" name="nomeTitularDebito" placeholder="Nome impresso no cartão">
        </div>

        <div class="payment-details" id="detalhesBoleto">
            <!-- Dados do Boleto -->
            <h4>Boleto Bancário</h4>
            <p class="info-text">O boleto será gerado e enviado para o e-mail cadastrado após a confirmação do pedido.</p>
        </div>

        <!-- Exibição do Total -->
        <div class="total">
            Total a Pagar: R$ <span th:text="${cliente.carrinho.total}"></span>
        </div>

        <!-- Botão de Confirmar Dados -->
        <button type="submit" class="btn">Confirmar Dados</button>
    </form>

</div>

<script>
    function verificarCamposPreenchidos(idDiv) {
        const inputs = document.querySelectorAll(`#${idDiv} input`);
        for (let i = 0; i < inputs.length; i++) {
            if (inputs[i].value.trim() === "") {
                return false; // Se algum campo estiver vazio, retorna falso
            }
        }
        return true; // Se todos os campos estiverem preenchidos, retorna verdadeiro
    }

    function gerenciarRequired() {
        const creditoPreenchido = verificarCamposPreenchidos('detalhesCredito');
        const debitoPreenchido = verificarCamposPreenchidos('detalhesDebito');

        const inputsCredito = document.querySelectorAll('#detalhesCredito input');
        const inputsDebito = document.querySelectorAll('#detalhesDebito input');

        // Se todos os campos de 'detalhesCredito' estiverem preenchidos, remove 'required' dos campos de 'detalhesDebito'
        if (creditoPreenchido) {
            inputsDebito.forEach(input => input.removeAttribute('required'));
        } else {
            inputsDebito.forEach(input => input.setAttribute('required', ''));
        }

        // Se todos os campos de 'detalhesDebito' estiverem preenchidos, remove 'required' dos campos de 'detalhesCredito'
        if (debitoPreenchido) {
            inputsCredito.forEach(input => input.removeAttribute('required'));
        } else {
            inputsCredito.forEach(input => input.setAttribute('required', ''));
        }
    }

    function mostrarDetalhesPagamento() {
        document.getElementById("detalhesCredito").style.display = "none";
        document.getElementById("detalhesDebito").style.display = "none";
        document.getElementById("detalhesBoleto").style.display = "none";

        const formaPagamento = document.getElementById("formaPagamento").value;
        if (formaPagamento === "credito") {
            document.getElementById("detalhesCredito").style.display = "block";
        } else if (formaPagamento === "debito") {
            document.getElementById("detalhesDebito").style.display = "block";
        } else if (formaPagamento === "boleto") {
            document.getElementById("detalhesBoleto").style.display = "block";
        }

        gerenciarRequired();
    }

    document.getElementById("detalhesCredito").addEventListener("input", gerenciarRequired);
    document.getElementById("detalhesDebito").addEventListener("input", gerenciarRequired);
</script>

</body>
</html>
