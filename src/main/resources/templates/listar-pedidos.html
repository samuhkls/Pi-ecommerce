<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Pedidos</title>
    <style>
        /* Estilos gerais */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
            color: #2c3e50;
        }

        /* Mensagens de sucesso e erro */
        div[th\\:if="${mensagem}"] p {
            background-color: #dff0d8;
            color: #3c763d;
            padding: 10px;
            border: 1px solid #d6e9c6;
            border-radius: 5px;
            width: 80%;
            margin: 10px auto;
            text-align: center;
        }

        div[th\\:if="${erro}"] p {
            background-color: #f2dede;
            color: #a94442;
            padding: 10px;
            border: 1px solid #ebccd1;
            border-radius: 5px;
            width: 80%;
            margin: 10px auto;
            text-align: center;
        }

        /* Estilo da tabela */
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            background-color: #fff;
        }

        thead {
            background-color: #2c3e50;
            color: #fff;
        }

        th, td {
            padding: 10px 15px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            font-weight: bold;
            text-transform: uppercase;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #e1f5fe;
        }

        /* Estilo do formulário e botão */
        form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select {
            padding: 5px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        button[type="submit"] {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }

        button[type="submit"]:hover {
            background-color: #2980b9;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            table {
                font-size: 14px;
            }

            th, td {
                padding: 8px 10px;
            }

            button[type="submit"] {
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
<h1>Pedidos</h1>

<div th:if="${mensagem}">
    <p th:text="${mensagem}"></p>
</div>
<div th:if="${erro}">
    <p th:text="${erro}"></p>
</div>

<table>
    <thead>
    <tr>
        <th>Data</th>
        <th>Número do Pedido</th>
        <th>Valor Total</th>
        <th>Status</th>
        <th>Ação</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="pedido : ${pedidos}">
        <td class="data-pedido" th:text="${pedido.dataPedido}"></td>
        <td th:text="${pedido.numeroPedido}"></td>
        <td th:text="${pedido.valorTotal}"></td>
        <td th:text="${pedido.status}"></td>
        <td>
            <form th:action="@{/estoquista/alterar-status/{id}(id=${pedido.id})}" method="post">
                <select name="status">
                    <option th:each="status : ${T(ecommerce.junior.model.StatusPedido).values()}"
                            th:value="${status}" th:text="${status}"
                            th:selected="${status == pedido.status}">
                    </option>
                </select>
                <button type="submit">Atualizar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const formatarData = (dataIso) => {
            const data = new Date(dataIso);
            const dia = String(data.getDate()).padStart(2, '0');
            const mes = String(data.getMonth() + 1).padStart(2, '0'); // Meses começam de 0
            const ano = data.getFullYear();
            const horas = String(data.getHours()).padStart(2, '0');
            const minutos = String(data.getMinutes()).padStart(2, '0');
            return `${dia}/${mes}/${ano} ${horas}:${minutos}`;
        };

        document.querySelectorAll('.data-pedido').forEach(elemento => {
            const dataIso = elemento.textContent; // Data ISO no conteúdo do elemento
            if (dataIso) {
                elemento.textContent = formatarData(dataIso); // Substitui pelo formato desejado
            }
        });
    });
</script>
</body>
</html>
