<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        /* Estilos Gerais */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .form-container {
            background-color: #ffffff;
            padding: 2em;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 1em;
        }

        label {
            display: block;
            text-align: left;
            color: #555;
            margin-top: 1em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 0.8em;
            margin-top: 0.5em;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #4a90e2;
            outline: none;
        }

        button {
            width: 100%;
            padding: 1em;
            background-color: #4a90e2;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            margin-top: 1em;
        }

        button:hover {
            background-color: #357ab8;
        }

        .btn {
            text-decoration: none;
            display: inline-block;
            width: 100%;
        }

        .error {
            border-color: #e74c3c;
        }

        .error-message {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 0.5em;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Login</h2>
    <form action="/login" method="post">
        <label for="email">Email:</label>
        <input type="text" id="email" name="email" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" required>

        <button type="submit">Login</button>
    </form>
    <a href="/cadastrar" class="btn">
        <button type="button">Cadastrar</button>
    </a>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const email = document.getElementById("email");
        const senha = document.getElementById("senha");

        function mostrarMensagemErro(input, mensagem) {
            let errorMessage = input.parentNode.querySelector(".error-message");
            if (!errorMessage) {
                errorMessage = document.createElement("div");
                errorMessage.classList.add("error-message");
                input.parentNode.appendChild(errorMessage);
            }
            errorMessage.textContent = mensagem;
        }

        function removerMensagemErro(input) {
            const errorMessage = input.parentNode.querySelector(".error-message");
            if (errorMessage) {
                errorMessage.remove();
            }
        }

        // Exemplo de validação para email
        email.addEventListener("input", () => {
            if (!email.value.includes("@")) {
                email.classList.add("error");
                mostrarMensagemErro(email, "Insira um email válido.");
            } else {
                email.classList.remove("error");
                removerMensagemErro(email);
            }
        });
    });
</script>
</body>
</html>
