<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-top: 10px;
            font-weight: bold;
            color: #333;
        }

        input, select, button {
            margin-top: 5px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
            border: none;
            margin-top: 15px;
        }

        button:hover {
            background-color: #2980b9;
        }

        .error {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Cadastrar Usuário</h1>
    <form th:action="@{/usuarios/cadastrar-usuario}" method="post" onsubmit="return validarFormulario();">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome completo"
               th:value="${user.nome}" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="Digite o CPF"
               th:value="${user.cpf}" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Digite o email"
               th:value="${user.email}" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite a senha" required>

        <label for="senhaConfirmacao">Confirme a Senha</label>
        <input type="password" id="senhaConfirmacao" name="senhaConfirmacao" placeholder="Confirme a senha" required>

        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo" th:value="${user.tipo}" required>
            <option value="" disabled selected>Selecione o tipo</option>
            <option value="ADMINISTRADOR" th:selected="${user.tipo == 'ADMINISTRADOR'}">Administrador</option>
            <option value="ESTOQUISTA" th:selected="${user.tipo == 'ESTOQUISTA'}">Estoquista</option>
        </select>

        <button type="submit">Cadastrar</button>
    </form>
    <p class="error" th:if="${erro}" th:text="${erro}"></p>
    <p class="success" th:if="${mensagem}" th:text="${mensagem}"></p>
</div>

<script>
    function validarFormulario() {
        const nome = document.getElementById('nome').value.trim();
        const cpf = document.getElementById('cpf').value.trim();
        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value.trim();
        const senhaConfirmacao = document.getElementById('senhaConfirmacao').value.trim();
        const tipo = document.getElementById('tipo').value;

        if (nome.split(' ').length < 2) {
            alert('O nome deve conter pelo menos duas palavras.');
            return false;
        }

        if (!/^\d{11}$/.test(cpf)) {
            alert('O CPF deve conter 11 números.');
            return false;
        }

        if (senha !== senhaConfirmacao) {
            alert('As senhas não coincidem.');
            return false;
        }

        if (!tipo) {
            alert('Por favor, selecione um tipo.');
            return false;
        }

        return true;
    }
</script>
</body>
</html>
