<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página do Cliente</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f9f9f9;
    }

    header {
        background-color: #4a90e2;
        color: white;
        padding: 1em;
        text-align: center;
    }

    main {
        padding: 2em;
        text-align: center;
    }

    a {
        display: inline-block;
        margin: 1em 0;
        padding: 0.5em 1em;
        color: white;
        background-color: #4a90e2;
        text-decoration: none;
        border-radius: 5px;
    }

    a:hover {
        background-color: #357ab8;
    }
  </style>
</head>
<body>
<header>
  <h1>Bem-vindo à Loja Online</h1>
</header>
<main>
  <p>Olá, Cliente! Explore nossos produtos e faça suas compras com facilidade.</p>
  <a href="/produtos">Ver Produtos</a>
  <a href="/carrinho">Meu Carrinho</a>
  <a href="/logout">Sair</a>
</main>
</body>
</html>
