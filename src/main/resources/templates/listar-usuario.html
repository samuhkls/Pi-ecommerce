<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuários</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        form {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        form input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        form button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        form button:hover {
            background-color: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        table th, table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        table th {
            background-color: #f4f4f9;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
        }

        .buttons a button {
            padding: 10px 20px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .buttons a button:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Lista de Usuários</h2>

    <!-- Formulário de filtragem -->
    <form th:action="@{/usuarios}" method="get">
        <input type="text" name="nome" placeholder="Filtrar por nome" th:value="${param.nome}">
        <button type="submit">Filtrar</button>
    </form>

    <!-- Tabela de usuários -->
    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Status</th>
            <th>Editar</th>
            <th>Ativar/Desativar</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.nome}">Nome</td>
            <td th:text="${user.email}">Email</td>
            <td th:text="${user.ativo ? 'Ativo' : 'Inativo'}">Status</td>
            <td>
                <a th:href="@{/editar/{id}(id=${user.id})}">
                    <button type="button">Editar</button>
                </a>
            </td>
            <td>
                <form th:action="@{/usuarios/status/{id}(id=${user.id})}" method="post">
                    <button type="submit" th:text="${user.ativo ? 'Desativar' : 'Ativar'}">Ativar/Desativar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Botões de ações -->
    <div class="buttons">
        <a th:href="@{/usuarios/cadastrar-usuario}">
            <button type="button">Adicionar Usuário</button>
        </a>
        <a th:href="@{/logout}">
            <button type="button">Deslogar</button>
        </a>
    </div>
</div>
</body>
</html>
