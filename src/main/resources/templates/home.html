<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Loja - Produtos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
            color: white;
        }

        .logo img {
            height: 50px;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
        }

        .produtos {
            padding: 20px;
        }

        .produto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .produto-card {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .produto-imagem img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .detalhes-btn, .carrinho-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .carrinho-btn {
            background-color: #28a745;
        }

        .detalhes-btn:hover, .carrinho-btn:hover {
            opacity: 0.9;
        }

        .produto-card.inativo {
            display: none;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <img th:src="@{/img/logo.jpg}" alt="Logo da Loja">
    </div>
    <nav>
        <ul>
            <!-- Exibe "Login / Cadastro" se o usuário não estiver logado -->
            <li th:if="${userRole == null}"><a th:href="@{/login}">Faça login / Crie seu login</a></li>

            <!-- Exibe "Logout" se o usuário estiver logado -->
            <li th:if="${userRole != null}"><a th:href="@{/logout}">Logout</a></li>

            <li><a th:href="@{/carrinho}">Carrinho (<span th:text="${carrinho != null ? #lists.size(carrinho) : 0}">0</span>)</a></li>
        </ul>
    </nav>
</header>

<section class="produtos">
    <h1>Nossos Produtos</h1>
    <div class="produto-grid">
        <div th:each="produto : ${produtos}"  th:classappend="${produto.ativo == false ? 'inativo' : ''}"  class="produto-card">

            <div class="produto-imagem">
                <img th:src="@{/{url}(url=${produto.imagens != null && !#lists.isEmpty(produto.imagens) ? produto.imagens[0].url : 'img/placeholder.png'})}"
                     th:alt="${produto.nome}" />
            </div>

            <h2 th:text="${produto.nome}">Nome do Produto</h2>
            <p>Preço: R$ <span th:text="${#numbers.formatDecimal(produto.preco, 2, 2)}">0.00</span></p>

            <a th:href="@{/admin/produtos/detalhes/{id}(id=${produto.id})}" class="detalhes-btn">Ver Detalhes</a>

            <form th:action="@{/carrinho/adicionar/{id}(id=${produto.id})}" method="post">
                <button type="submit" class="carrinho-btn">Adicionar ao Carrinho</button>
            </form>
        </div>
    </div>
</section>

</body>
</html>
