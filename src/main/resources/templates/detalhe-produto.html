<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title><!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org">
    <head>
    <meta charset="UTF-8">
    <title>Detalhes do Produto</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <div class="produto-detalhe">

    <div th:each="imagem : ${imagens}">
      <img th:if="${imagem != null}" th:src="@{/{url}(url=${imagem.url})}" alt="Imagem" />
    </div>

    <h1 th:text="${produto.nome}">Nome do Produto</h1>
    <p th:text="${produto.descricaoDetalhada}">Descrição do Produto</p>
    <h3 th:text="${produto.preco}">Preço</h3>
    <form th:action="@{/carrinho/adicionar/{id}(id=${produto.id})}" method="post">
      <button type="submit" class="carrinho-btn">Adicionar ao Carrinho</button>
    </form>
  </div>
</div>
</body>
</html>
</title>
</head>
<body>

</body>
</html>
